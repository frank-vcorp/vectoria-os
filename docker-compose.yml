services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vectoria
      POSTGRES_PASSWORD: vectoria
      POSTGRES_DB: vectoria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectoria"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "43123:43123"
    environment:
      DATABASE_URL: postgresql://vectoria:vectoria@db:5432/vectoria
      SESSION_SECRET: local-dev-secret-change-me
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
